<meta name="citation_title" content="{{ page.title | escape }}">
{% for a in page.authors %}
<meta name="citation_author" content="{{ a.name | escape }}">
{% if a.affiliation %}<meta name="citation_author_institution" content="{{ a.affiliation | escape }}">{% endif %}
{% if a.orcid %}<meta name="citation_author_orcid" content="https://orcid.org/{{ a.orcid }}">{% endif %}
{% endfor %}
<meta name="citation_publication_date" content="{{ page.year }}">
<meta name="citation_conference_title" content="{{ page.venue | escape }}">
{% if page.doi %}<meta name="citation_doi" content="{{ page.doi }}">{% endif %}
{% if page.pdf %}
<meta name="citation_pdf_url" content="{{ '/assets/publications/' | append: page.slug | append: '/' | append: page.pdf | absolute_url }}">
<meta property="og:image" content="{{ '/assets/publications/' | append: page.slug | append: '/thumb.png' | absolute_url }}">
{% endif %}
